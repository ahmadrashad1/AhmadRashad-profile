<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 460" role="img" aria-label="Cartoon 3D-style illustration of Ahmad Rashad waving hello">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EAF3EA" />
      <stop offset="1" stop-color="#F4E3D6" />
    </linearGradient>
    <linearGradient id="blazerGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4C5058" />
      <stop offset="1" stop-color="#2C2F35" />
    </linearGradient>
    <linearGradient id="sleeveGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#565B64" />
      <stop offset="1" stop-color="#343841" />
    </linearGradient>
    <radialGradient id="skinGrad" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#FDEBDC" />
      <stop offset="1" stop-color="#F0C8AB" />
    </radialGradient>
    <radialGradient id="handGrad" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#FDEBDC" />
      <stop offset="1" stop-color="#EDC2A2" />
    </radialGradient>
    <linearGradient id="hairGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A2A1E" />
      <stop offset="1" stop-color="#17100B" />
    </linearGradient>
  </defs>

  <style>
    /* pivot coordinates are read in viewBox units */
    .wave, .bob, .lids { transform-box: view-box; }

    .bob {
      transform-origin: 200px 300px;
      animation: bob 4.2s ease-in-out infinite;
    }
    .wave {
      transform-origin: 316px 296px;
      animation: wave 3.2s ease-in-out infinite;
    }
    .lids {
      transform-origin: 200px 215px;
      animation: blink 5.4s ease-in-out infinite;
    }

    @keyframes bob {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50%      { transform: translateY(-3px) rotate(-1.2deg); }
    }

    /* rests half-raised, then fires a friendly "hi" every cycle */
    @keyframes wave {
      0%, 48%, 100% { transform: rotate(-3deg); }
      56%           { transform: rotate(-15deg); }
      64%           { transform: rotate(7deg); }
      72%           { transform: rotate(-13deg); }
      80%           { transform: rotate(6deg); }
      88%           { transform: rotate(-6deg); }
    }

    @keyframes blink {
      0%, 92%, 100% { transform: scaleY(1); }
      95%           { transform: scaleY(0.08); }
    }

    @media (prefers-reduced-motion: reduce) {
      .bob, .wave, .lids { animation: none; }
      .wave { transform: rotate(-3deg); }
    }
  </style>

  <rect x="0" y="0" width="400" height="460" fill="url(#bgGrad)" />

  <!-- ambient shadow -->
  <ellipse cx="200" cy="300" rx="120" ry="26" fill="#17100B" opacity="0.14" />

  <!-- blazer / shoulders -->
  <path d="M-10,460 L-10,412 C-10,337 65,287 145,283 L255,283 C335,287 410,337 410,412 L410,460 Z" fill="url(#blazerGrad)" />
  <!-- shirt collar peeking under the blazer -->
  <path d="M172,282 L228,282 L200,332 Z" fill="#F8F4EC" />
  <path d="M200,332 L172,282 L186,280 L200,312 Z" fill="#E7E0D2" opacity="0.7" />

  <!-- neck -->
  <rect x="172" y="255" width="56" height="50" rx="16" fill="#EBBE9C" />
  <!-- soft shadow where the jaw meets the neck -->
  <ellipse cx="200" cy="262" rx="40" ry="14" fill="#D9A480" opacity="0.45" />

  <g class="bob">
    <!-- hair (back mass, sits behind/above the face oval) -->
    <ellipse cx="200" cy="148" rx="132" ry="148" fill="url(#hairGrad)" />
    <!-- tousled crown spikes -->
    <ellipse cx="150" cy="35" rx="19" ry="31" fill="url(#hairGrad)" transform="rotate(-20 150 35)" />
    <ellipse cx="195" cy="16" rx="21" ry="33" fill="url(#hairGrad)" transform="rotate(-4 195 16)" />
    <ellipse cx="240" cy="32" rx="19" ry="31" fill="url(#hairGrad)" transform="rotate(16 240 32)" />
    <ellipse cx="270" cy="56" rx="17" ry="27" fill="url(#hairGrad)" transform="rotate(32 270 56)" />
    <ellipse cx="126" cy="60" rx="17" ry="27" fill="url(#hairGrad)" transform="rotate(-32 126 60)" />
    <!-- poofy side volume, past the ears -->
    <ellipse cx="93" cy="188" rx="39" ry="59" fill="url(#hairGrad)" />
    <ellipse cx="307" cy="188" rx="39" ry="59" fill="url(#hairGrad)" />

    <!-- ears -->
    <ellipse cx="98" cy="217" rx="15" ry="23" fill="#F0C8AB" />
    <ellipse cx="302" cy="217" rx="15" ry="23" fill="#F0C8AB" />
    <ellipse cx="99" cy="218" rx="7" ry="12" fill="#DDA982" opacity="0.5" />
    <ellipse cx="301" cy="218" rx="7" ry="12" fill="#DDA982" opacity="0.5" />

    <!-- head / face (painted over the hair ellipse) -->
    <ellipse cx="200" cy="216" rx="97" ry="96" fill="url(#skinGrad)" />
    <!-- clean-shaven jaw: a warm form shadow, no stubble -->
    <path d="M118,254 C142,300 258,300 282,254 C274,298 240,320 200,320 C160,320 126,298 118,254 Z" fill="#DFAE89" opacity="0.26" />

    <!-- heavy tousled fringe over the forehead -->
    <ellipse cx="133" cy="156" rx="27" ry="43" fill="url(#hairGrad)" transform="rotate(-14 133 156)" />
    <ellipse cx="166" cy="144" rx="25" ry="47" fill="url(#hairGrad)" transform="rotate(-7 166 144)" />
    <ellipse cx="200" cy="137" rx="27" ry="43" fill="url(#hairGrad)" />
    <ellipse cx="234" cy="144" rx="25" ry="47" fill="url(#hairGrad)" transform="rotate(7 234 144)" />
    <ellipse cx="267" cy="156" rx="27" ry="43" fill="url(#hairGrad)" transform="rotate(14 267 156)" />

    <!-- hair sheen strands -->
    <path d="M145,110 C155,130 158,150 150,168" fill="none" stroke="#6B5340" stroke-width="3.5" stroke-linecap="round" opacity="0.22" />
    <path d="M195,95 C198,118 197,140 192,160" fill="none" stroke="#6B5340" stroke-width="3.5" stroke-linecap="round" opacity="0.20" />
    <path d="M250,112 C244,132 244,150 252,168" fill="none" stroke="#6B5340" stroke-width="3.5" stroke-linecap="round" opacity="0.22" />

    <!-- cheeks -->
    <ellipse cx="150" cy="236" rx="20" ry="11" fill="#F0907A" opacity="0.30" />
    <ellipse cx="250" cy="236" rx="20" ry="11" fill="#F0907A" opacity="0.30" />

    <!-- eyebrows: thick, close-set -->
    <rect x="136" y="177" width="48" height="12" rx="6" fill="#241810" transform="rotate(-3 160 183)" />
    <rect x="216" y="177" width="48" height="12" rx="6" fill="#241810" transform="rotate(3 240 183)" />

    <!-- glasses -->
    <g fill="none" stroke="#7A3F22" stroke-width="6.5" stroke-linejoin="round">
      <rect x="129" y="189" width="69" height="50" rx="14" />
      <rect x="202" y="189" width="69" height="50" rx="14" />
      <line x1="198" y1="210" x2="202" y2="210" stroke-width="6.5" />
      <line x1="123" y1="200" x2="98" y2="196" stroke-linecap="round" />
      <line x1="277" y1="200" x2="302" y2="196" stroke-linecap="round" />
    </g>
    <rect x="129" y="189" width="69" height="50" rx="14" fill="#EAF4FB" opacity="0.16" />
    <rect x="202" y="189" width="69" height="50" rx="14" fill="#EAF4FB" opacity="0.16" />
    <!-- lens glare -->
    <path d="M136,230 L156,195 L170,195 L150,230 Z" fill="#FFFFFF" opacity="0.18" />
    <path d="M209,230 L229,195 L243,195 L223,230 Z" fill="#FFFFFF" opacity="0.18" />

    <!-- eyes -->
    <g class="lids">
      <ellipse cx="163.5" cy="215" rx="6.5" ry="8" fill="#2B1F15" />
      <ellipse cx="236.5" cy="215" rx="6.5" ry="8" fill="#2B1F15" />
      <circle cx="166" cy="212" r="1.8" fill="#FFFFFF" opacity="0.9" />
      <circle cx="239" cy="212" r="1.8" fill="#FFFFFF" opacity="0.9" />
    </g>

    <!-- nose -->
    <path d="M198,222 C196,235 193,243 200,248 C205,243 204,235 202,222" fill="none" stroke="#D99872" stroke-width="3.5" stroke-linecap="round" opacity="0.85" />

    <!-- mouth: warm open smile -->
    <path d="M174,258 C188,279 212,279 226,258 Z" fill="#A9524A" />
    <path d="M181,269 C191,277 209,277 219,269 C209,274 191,274 181,269 Z" fill="#F7F4EE" opacity="0.9" />

    <!-- top highlight for glossy clay feel -->
    <ellipse cx="160" cy="120" rx="40" ry="20" fill="#FFFFFF" opacity="0.08" />
  </g>

  <!-- waving arm: upper arm is fixed, forearm + hand pivot at the elbow -->
  <g class="arm">
    <path d="M286,352 L316,296" stroke="url(#sleeveGrad)" stroke-width="40" stroke-linecap="round" fill="none" />
    <g class="wave">
      <path d="M316,298 L333,232" stroke="url(#sleeveGrad)" stroke-width="33" stroke-linecap="round" fill="none" />
      <!-- shirt cuff -->
      <rect x="317" y="217" width="32" height="15" rx="7.5" fill="#F8F4EC" transform="rotate(-13 333 224)" />
      <!-- open palm -->
      <g transform="rotate(-6 330 205) translate(9 -9) translate(330 205) scale(1.09) translate(-330 -205)">
        <rect x="308" y="170" width="11.5" height="36" rx="5.75" fill="url(#handGrad)" />
        <rect x="321" y="163" width="11.5" height="43" rx="5.75" fill="url(#handGrad)" />
        <rect x="334" y="167" width="11.5" height="39" rx="5.75" fill="url(#handGrad)" />
        <rect x="346.5" y="176" width="10.5" height="30" rx="5.25" fill="url(#handGrad)" />
        <rect x="304" y="190" width="54" height="44" rx="18" fill="url(#handGrad)" />
        <rect x="294" y="196" width="11" height="28" rx="5.5" fill="url(#handGrad)" transform="rotate(-32 299.5 210)" />
        <!-- palm crease, keeps it from reading flat -->
        <path d="M316,206 C326,214 338,214 347,207" fill="none" stroke="#DBA47E" stroke-width="3" stroke-linecap="round" opacity="0.55" />
      </g>
    </g>
  </g>
</svg>
