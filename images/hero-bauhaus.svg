<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"
     preserveAspectRatio="xMidYMax slice" role="img" aria-label="">
  <!--
    Bauhaus Dessau, rebuilt as vector.

    Drawn from images/inspiration.jpg rather than tracing it: the source is
    736x552 and went soft the moment it was scaled past a laptop. Every mark
    here is a primitive from the system's own vocabulary (circle, rectangle,
    triangle, straight rule) in the eight-value palette, so it stays sharp at
    any resolution and cannot introduce an off-palette colour.

    One-point perspective, vanishing point at (1500, 580).
  -->

  <defs>
    <clipPath id="plaza">
      <rect x="0" y="580" width="1600" height="320" />
    </clipPath>
    <clipPath id="facade">
      <polygon points="700,360 1450,505 1450,583 700,600" />
    </clipPath>
    <clipPath id="tower">
      <rect x="556" y="246" width="104" height="356" />
    </clipPath>
  </defs>

  <!-- ===== ground and sky ===== -->
  <rect width="1600" height="900" fill="#F7F2E7" />
  <rect y="580" width="1600" height="320" fill="#EFE7D7" />

  <!-- plaza: perspective lines converging on the vanishing point -->
  <g clip-path="url(#plaza)" stroke="#15161A" stroke-width="1.2" opacity="0.38" fill="none">
    <path d="M1500 580 L-520 900" /><path d="M1500 580 L-180 900" />
    <path d="M1500 580 L140 900" /><path d="M1500 580 L440 900" />
    <path d="M1500 580 L720 900" /><path d="M1500 580 L980 900" />
    <path d="M1500 580 L1230 900" /><path d="M1500 580 L1460 900" />
    <!-- lateral courses, spaced wider as they come forward -->
    <path d="M0 614 H1600" /><path d="M0 644 H1600" /><path d="M0 686 H1600" />
    <path d="M0 744 H1600" /><path d="M0 822 H1600" />
  </g>

  <!-- ===== left mass: the dark embankment ===== -->
  <polygon points="0,452 132,452 272,544 384,544 384,604 0,604" fill="#15161A" />
  <polygon points="132,452 272,544 132,544" fill="#F7F2E7" />

  <!-- blue slab tucked into the embankment -->
  <polygon points="196,548 306,548 306,604 196,604" fill="#1E4FA1" />
  <polygon points="306,548 384,576 384,604 306,604" fill="#15161A" />

  <!-- pale block with its shadowed soffit -->
  <polygon points="104,468 244,468 244,516 104,516" fill="#F7F2E7" stroke="#15161A" stroke-width="2.5" />
  <polygon points="172,516 244,516 244,542 172,542" fill="#15161A" />

  <!-- ===== trees: circle on a pole, the whole vocabulary ===== -->
  <g fill="#15161A">
    <rect x="58" y="392" width="2.5" height="212" />
    <circle cx="59" cy="392" r="38" />
    <rect x="166" y="430" width="2.5" height="174" />
    <circle cx="167" cy="430" r="30" />
    <rect x="262" y="468" width="2.5" height="136" />
    <circle cx="263" cy="468" r="24" />
    <rect x="336" y="498" width="2.5" height="106" />
    <circle cx="337" cy="498" r="19" />
    <rect x="408" y="444" width="3" height="160" />
    <circle cx="409" cy="444" r="48" />
  </g>

  <!-- an open circle, the one unfilled shape -->
  <circle cx="222" cy="418" r="24" fill="none" stroke="#15161A" stroke-width="2.5" />
  <circle cx="300" cy="404" r="9" fill="#F7F2E7" stroke="#15161A" stroke-width="2.5" />

  <!-- ===== tower block ===== -->
  <rect x="556" y="246" width="104" height="356" fill="#1E4FA1" />
  <rect x="556" y="246" width="54" height="356" fill="#15161A" opacity="0.22" />
  <g clip-path="url(#tower)" fill="#F7F2E7">
    <rect x="566" y="300" width="36" height="12" /><rect x="614" y="300" width="36" height="12" />
    <rect x="566" y="330" width="36" height="12" /><rect x="614" y="330" width="36" height="12" />
    <rect x="566" y="360" width="36" height="12" /><rect x="614" y="360" width="36" height="12" />
    <rect x="566" y="390" width="36" height="12" /><rect x="614" y="390" width="36" height="12" />
  </g>

  <!-- the gridded stair tower, drawn as a true lattice -->
  <rect x="436" y="392" width="92" height="190" fill="#F7F2E7" stroke="#15161A" stroke-width="2.5" />
  <g stroke="#15161A" stroke-width="2" opacity="0.9">
    <path d="M459 392 V582" /><path d="M482 392 V582" /><path d="M505 392 V582" />
    <path d="M436 420 H528" /><path d="M436 448 H528" /><path d="M436 476 H528" />
    <path d="M436 504 H528" /><path d="M436 532 H528" /><path d="M436 560 H528" />
  </g>

  <!-- low wing with colonnade -->
  <rect x="528" y="470" width="176" height="132" fill="#F7F2E7" stroke="#15161A" stroke-width="2.5" />
  <g fill="#15161A">
    <rect x="546" y="492" width="11" height="96" /><rect x="573" y="492" width="11" height="96" />
    <rect x="600" y="492" width="11" height="96" /><rect x="627" y="492" width="11" height="96" />
    <rect x="654" y="492" width="11" height="96" /><rect x="681" y="492" width="11" height="96" />
  </g>

  <!-- ===== the long workshop wing, receding to the vanishing point ===== -->
  <polygon points="700,360 1450,505 1450,583 700,600" fill="#F7F2E7" />
  <!-- glazing bands, interpolated between the roofline and the sill line -->
  <g clip-path="url(#facade)" fill="#15161A">
    <polygon points="700,384 1450,511 1450,518 700,401" />
    <polygon points="700,432 1450,528 1450,534 700,449" />
    <polygon points="700,480 1450,544 1450,550 700,497" />
    <polygon points="700,528 1450,560 1450,565 700,545" />
    <polygon points="700,571 1450,574 1450,579 700,588" />
  </g>
  <!-- blue structural piers -->
  <g clip-path="url(#facade)" fill="#1E4FA1">
    <polygon points="878,394 914,401 914,596 878,595" />
    <polygon points="1138,444 1166,450 1166,590 1138,589" />
    <polygon points="1330,481 1352,485 1352,586 1330,586" />
  </g>
  <!-- the single red banner -->
  <polygon points="1372,505 1452,520 1452,545 1372,533" fill="#CE4435" />
  <!-- roofline and sill, drawn as rules so the perspective reads -->
  <g stroke="#15161A" stroke-width="3" fill="none">
    <path d="M700 360 L1450 505" />
    <path d="M700 600 L1450 583" />
    <path d="M700 360 V600" />
  </g>

  <!-- the canopy that runs past the far end -->
  <path d="M1450 505 L1570 530 L1570 539 L1450 514 Z" fill="#15161A" />

  <!-- entrance steps -->
  <g fill="#15161A" opacity="0.92">
    <rect x="690" y="600" width="226" height="5" />
    <rect x="706" y="610" width="210" height="5" />
    <rect x="722" y="620" width="194" height="5" />
  </g>
  <rect x="664" y="556" width="48" height="48" fill="#15161A" />

  <!-- ===== figures on the plaza ===== -->
  <g>
    <g fill="#15161A">
      <rect x="1160" y="604" width="11" height="30" rx="5" /><circle cx="1165.5" cy="600" r="5.5" />
      <rect x="1182" y="604" width="11" height="30" rx="5" /><circle cx="1187.5" cy="600" r="5.5" />
    </g>
    <g fill="#CE4435">
      <rect x="1204" y="605" width="11" height="29" rx="5" /><circle cx="1209.5" cy="601" r="5.5" />
    </g>
    <g fill="#1E4FA1">
      <rect x="1318" y="600" width="10" height="26" rx="5" /><circle cx="1323" cy="596.5" r="5" />
    </g>
    <g fill="#E9A92F">
      <rect x="1416" y="597" width="9" height="23" rx="4.5" /><circle cx="1420.5" cy="594" r="4.5" />
    </g>
    <g fill="#15161A">
      <rect x="1432" y="597" width="9" height="23" rx="4.5" /><circle cx="1436.5" cy="594" r="4.5" />
    </g>
  </g>

  <!-- ===== the floating marks: circles, dot fields, rules ===== -->
  <circle cx="186" cy="150" r="66" fill="#CE4435" />
  <g fill="#15161A">
    <circle cx="160" cy="246" r="4" /><circle cx="160" cy="276" r="4" />
    <circle cx="160" cy="306" r="4" /><circle cx="160" cy="336" r="4" />
    <circle cx="160" cy="366" r="4" /><circle cx="160" cy="396" r="4" />
  </g>

  <circle cx="1318" cy="232" r="56" fill="#E9A92F" />

  <!-- dot field: dense at its centre, thinning outward -->
  <g fill="#15161A">
    <circle cx="1196" cy="452" r="3" /><circle cx="1240" cy="440" r="3.5" />
    <circle cx="1284" cy="432" r="3" /><circle cx="1328" cy="424" r="4" />
    <circle cx="1372" cy="418" r="3" /><circle cx="1416" cy="412" r="3" />
    <circle cx="1240" cy="408" r="3" /><circle cx="1284" cy="400" r="3.5" />
    <circle cx="1328" cy="392" r="7" /><circle cx="1372" cy="386" r="3.5" />
    <circle cx="1416" cy="380" r="3" /><circle cx="1284" cy="368" r="3" />
    <circle cx="1328" cy="360" r="3.5" /><circle cx="1372" cy="354" r="3" />
    <circle cx="1240" cy="470" r="3" /><circle cx="1284" cy="494" r="3" />
    <circle cx="1328" cy="486" r="3" /><circle cx="1372" cy="478" r="3" />
  </g>

  <!-- the two small dots that sit alone -->
  <circle cx="302" cy="372" r="5" fill="#15161A" />
  <circle cx="330" cy="356" r="3.5" fill="#15161A" />

  <!-- right-hand rules: one solid, one dashed -->
  <rect x="1528" y="0" width="3.5" height="258" fill="#15161A" />
  <g fill="#15161A">
    <rect x="1529" y="296" width="2.5" height="22" /><rect x="1529" y="330" width="2.5" height="22" />
    <rect x="1529" y="364" width="2.5" height="22" /><rect x="1529" y="398" width="2.5" height="22" />
    <rect x="1529" y="432" width="2.5" height="22" /><rect x="1529" y="466" width="2.5" height="22" />
  </g>

  <!-- ===== corner weights ===== -->
  <!-- blue quarter-circle, bottom left -->
  <path d="M0 742 A188 188 0 0 1 188 930 L0 930 Z" fill="#1E4FA1" />
  <!-- red wedge, bottom right, with its black circle -->
  <polygon points="1600,742 1600,900 1172,900" fill="#CE4435" />
  <circle cx="1470" cy="838" r="52" fill="#15161A" />

  <!-- small marks -->
  <circle cx="266" cy="862" r="17" fill="#E9A92F" />
  <g fill="#15161A">
    <rect x="76" y="768" width="2.5" height="130" />
    <rect x="24" y="818" width="190" height="2.5" />
  </g>
</svg>
